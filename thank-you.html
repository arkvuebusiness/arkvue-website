<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Thank You | ARKVUE</title>
 
    <meta
        name="description"
        content="Thanks for contacting ARKVUE. We'll get back to you soon.">
 
    <link rel="canonical" href="https://arkvue.co/thank-you.html">
    <link rel="icon" href="/favicon.ico" sizes="any">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
        rel="stylesheet">
 
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
 
    <style>
        :root {
            --ink: #172033;
            --muted: #5d6678;
            --line: #e7e9ee;
            --soft: #f6f7f9;
            --accent: #1f6feb;
            --accent-dark: #1a5fd0;
            --white: #ffffff;
        }
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
 
        body {
            background: var(--ink);
            color: var(--white);
            font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
 
        a {
            color: inherit;
            text-decoration: none;
        }
 
        .container {
            width: min(100% - 40px, 640px);
            margin-inline: auto;
        }
 
        /* BUTTONS */
 
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 0;
            border-radius: 999px;
            padding: 13px 22px;
            font-size: 0.85rem;
            font-weight: 700;
            transition:
                transform .3s cubic-bezier(.16,1,.3,1),
                background .25s ease,
                color .25s ease,
                border-color .25s ease;
        }
 
        .button:hover {
            transform: translateY(-2px);
        }
 
        .button-primary {
            background: var(--accent);
            color: var(--white);
        }
 
        .button-primary:hover {
            background: var(--accent-dark);
        }
 
        .button-ghost {
            background: rgba(255,255,255,.06);
            color: var(--white);
            border: 1px solid rgba(255,255,255,.18);
        }
 
        .button-ghost:hover {
            background: rgba(255,255,255,.12);
            border-color: rgba(255,255,255,.32);
        }
 
        .arr {
            transition: transform .3s cubic-bezier(.16,1,.3,1);
        }
 
        .button:hover .arr {
            transform: translateX(4px);
        }
 
        /* PAGE */
 
        .page {
            position: relative;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 80px 0;
            text-align: center;
            background:
                radial-gradient(55% 60% at 50% 0%, rgba(90,150,255,.16), transparent 65%),
                var(--ink);
            overflow: hidden;
        }
 
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .02em;
            color: rgba(255,255,255,.7);
        }
 
        .brand-mark {
            width: 25px;
            height: 25px;
            flex: 0 0 25px;
            object-fit: contain;
            border-radius: 6px;
        }
 
        .success-icon {
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            margin: 40px auto 0;
            border-radius: 50%;
            background: rgba(90,150,255,.14);
            border: 1px solid rgba(90,150,255,.3);
        }
 
        .success-icon i {
            color: #9cc0ff;
            font-size: 1.6rem;
        }
 
        h1 {
            margin-top: 26px;
            color: var(--white);
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
 
        p {
            margin-top: 16px;
            max-width: 460px;
            margin-inline: auto;
            color: rgba(255,255,255,.62);
            font-size: 1.02rem;
            line-height: 1.7;
        }
 
        .thanks-actions {
            margin-top: 38px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
 
        @media (max-width: 480px) {
 
            .thanks-actions {
                flex-direction: column;
                align-items: stretch;
            }
 
            .thanks-actions .button {
                width: 100%;
            }
 
        }
    </style>
</head>
 
<body>
 
    <div class="page">
        <div class="container">
 
            <a href="index.html#top" class="brand" aria-label="ARKVUE home">
                <img class="brand-mark" src="/favicon/A.svg" alt="ARKVUE logo">
                <span>ARKVUE</span>
            </a>
 
            <div class="success-icon" aria-hidden="true">
                <i class="fa-solid fa-check"></i>
            </div>
 
            <h1>Thank you</h1>
 
            <p>
                Your message has been received. We'll take a look
                and get back to you within one business day.
            </p>
 
            <div class="thanks-actions">
 
                <a class="button button-primary" href="index.html#top">
                    Back to homepage
                    <span class="arr">→</span>
                </a>
 
                <a
                    class="button button-ghost"
                    href="https://calendly.com/hello-arkvue/growth-strategy-call-arkvue-1"
                    target="_blank"
                    rel="noopener noreferrer">
                    Book a Growth Audit
                </a>
 
            </div>
 
        </div>
    </div>
 
</body>
</html>
